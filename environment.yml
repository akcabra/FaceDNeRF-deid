# FaceDNeRF-deid environment.
#
# This keeps direct project dependencies enabled. Packages from the original
# environment that are only transitive dependencies (or are unused by this
# repository) remain below as comments for provenance. Let conda/pip resolve
# transitive dependencies instead of pinning them independently.
name: facednerf
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.9.16
  - pip=23.0.1
  - click=8.0.4
  - imageio=2.9.0
  - kornia=0.6.12
  - ninja=1.10.2
  # pyshtools 4.10.4 requires numpy>=1.25.2. Stay on NumPy 1.x for
  # compatibility with the legacy PyTorch 1.11 stack.
  - numpy=1.25.2
  - requests=2.26.0
  - tqdm=4.62.2

  # Not imported by this project.
  # - matplotlib-inline=0.1.6

  - pip:
      # PyTorch 1.11 is the version used by the original FaceDNeRF code.
      - --extra-index-url https://download.pytorch.org/whl/cu113
      - torch==1.11.0+cu113
      - torchvision==0.12.0+cu113

      # Direct runtime dependencies used across training, de-identification,
      # Stable Diffusion editing, visualization, metrics, and mesh export.
      - accelerate==0.18.0
      - diffusers==0.14.0
      - ftfy==6.1.1
      - glfw==2.2.0
      - huggingface-hub==0.13.4
      - imageio-ffmpeg==0.4.3
      - imgui==1.3.0
      - matplotlib==3.7.1
      - mrcfile==1.4.3
      # Currently unused: criteria/clip_loss.py is not imported by the active
      # training or de-identification pipelines. The PyPI 1.0 source archive
      # also fails during metadata generation because requirements.txt is absent.
      # - openai-clip==1.0
      - opencv-contrib-python==4.7.0.72
      - pillow==9.5.0
      - plyfile==0.9
      - psutil==5.9.4
      - pyopengl==3.1.5
      - pyspng==0.1.1
      - pyshtools==4.10.4
      # 0.21 removes the Python-3.9 scipy<1.9.2 constraint from 0.20.
      - scikit-image==0.21.0
      - scipy==1.10.1
      - tensorboard==2.12.1
      - transformers==4.27.4
      - trimesh==4.0.2

      # Unused or duplicate packages from the original environment. Some of
      # these will still be installed automatically when required transitively.
      # - absl-py==1.4.0
